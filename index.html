<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple to-do list dashboard with focus timer and quick links">
    <title>To-Do List Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header Component -->
    <header id="header-component">
        <div class="header-content">
            <div class="header-left">
                <h1 id="greeting-display">Welcome</h1>
                <div id="clock-display" class="clock">00:00:00</div>
                <div id="date-display" class="date"></div>
            </div>
            <div class="header-right">
                <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content">
        <!-- Focus Timer Component -->
        <section id="focus-timer" class="focus-timer">
            <h2>Focus Timer</h2>
            <div class="timer-display">
                <span id="timer-minutes">25</span>:<span id="timer-seconds">00</span>
            </div>
            <div class="timer-controls">
                <button id="timer-start" class="btn btn-primary">Start</button>
                <button id="timer-pause" class="btn btn-secondary">Pause</button>
                <button id="timer-reset" class="btn btn-secondary">Reset</button>
            </div>
            <div class="timer-settings">
                <label for="timer-duration-input">Duration (minutes):</label>
                <input 
                    type="number" 
                    id="timer-duration-input" 
                    min="1" 
                    max="120" 
                    value="25"
                    aria-label="Timer duration in minutes"
                >
                <button id="timer-set-duration" class="btn btn-small">Set</button>
            </div>
        </section>

        <!-- Task List Component -->
        <section id="task-list-component" class="task-list">
            <h2>To-Do List</h2>
            
            <!-- Task Form -->
            <form id="task-form" class="task-form">
                <div class="task-input-group">
                    <input 
                        type="text" 
                        id="task-input" 
                        placeholder="Add a new task..." 
                        maxlength="500"
                        aria-label="New task description"
                    >
                    <button type="submit" class="btn btn-primary">Add Task</button>
                </div>
                <div id="error-message" class="error-message" role="alert" aria-live="polite"></div>
            </form>

            <!-- Tasks Container -->
            <div id="tasks-container" class="tasks-container">
                <!-- Task items will be dynamically inserted here -->
            </div>
        </section>
    </main>

    <!-- Footer Component -->
    <footer id="footer-component">
        <div class="footer-content">
            <h3>Quick Links</h3>

            <!-- Add Link Form -->
            <form id="quick-link-form" class="quick-link-form">
                <div class="quick-link-input-group">
                    <input
                        type="text"
                        id="quick-link-label"
                        placeholder="Label (e.g. GitHub)"
                        maxlength="30"
                        aria-label="Link label"
                    >
                    <input
                        type="url"
                        id="quick-link-url"
                        placeholder="URL (e.g. https://github.com)"
                        maxlength="200"
                        aria-label="Link URL"
                    >
                    <button type="submit" class="btn btn-small btn-primary">+ Add</button>
                </div>
                <div id="quick-link-error" class="error-message" role="alert" aria-live="polite"></div>
            </form>

            <!-- Links rendered by JS -->
            <nav id="quick-links-container" class="quick-links">
                <!-- Dynamically populated from localStorage -->
            </nav>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
